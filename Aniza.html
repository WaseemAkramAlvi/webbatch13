<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aniza - Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #eef4f8;
            color: #203040;
        }

        .profile {
            width: min(100%, 620px);
            padding: 40px;
            background: #ffffff;
            border: 1px solid #d8e2e9;
            border-radius: 8px;
            box-shadow: 0 12px 30px rgba(32, 48, 64, 0.1);
        }

        .eyebrow {
            margin-bottom: 10px;
            color: #287c8c;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin-bottom: 12px;
            font-size: clamp(2rem, 6vw, 3.4rem);
            line-height: 1.05;
        }

        .intro {
            margin-bottom: 30px;
            color: #5b6d7a;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .details {
            display: grid;
            gap: 16px;
            padding-top: 24px;
            border-top: 1px solid #d8e2e9;
        }

        .detail {
            display: grid;
            gap: 4px;
        }

        .label {
            color: #287c8c;
            font-size: 0.78rem;
            font-weight: bold;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .value {
            color: #203040;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .profile {
                padding: 28px 24px;
            }
        }
    </style>
</head>
<body>
    <main class="profile">
        <p class="eyebrow">GTTI Management System</p>
        <h1>Aniza</h1>
        <p class="intro">Welcome to Aniza's profile page.</p>

        <section class="details" aria-label="Profile details">
            <div class="detail">
                <span class="label">Name</span>
                <span class="value">Aniza</span>
            </div>
            <div class="detail">
                <span class="label">Role</span>
                <span class="value">Student</span>
            </div>
            <div class="detail">
                <span class="label">Project</span>
                <span class="value">GTTI Management System</span>
            </div>
        </section>
    </main>
</body>
</html>
